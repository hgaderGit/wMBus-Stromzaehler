substitutions:
  mqtt_broker: 192.168.0.2
  mqtt_topic: MyZaehler
  
#  zaehler_id: "0x00000000"     # Wenn Zählernummer noch nicht bekannt ==> Aus Logs ermitteln minimum level: WARN
# [17:31:13.579][W][wmbus:065]: Telegram not handled by any handler
# [17:31:13.585][W][wmbus:070]: Check if telegram with address 00123456 can be parsed on:

  zaehler_id: "0x00123456"     # Zählernummer
  max_luecke_s: "60"    # größter erlaubter Abstand der beiden Telegramme für die Interpolation
  min_laufend_s: "30"   # Zwischenstand erst nach so vielen Sekunden in der Viertelstunde anzeigen
  
esphome:
  name: wmbus-stromzaehler
  friendly_name: wMBus Stromzähler
  platformio_options:
    upload_speed: 921600
  on_boot:
    # Front-End-Modul (GC1109) der V4 muss vor dem Funkchip aktiv sein
    priority: 700
    then:
      - output.turn_on: vext     # neu
      - output.turn_on: fem_power   # GPIO7: Versorgung Front-End
      - output.turn_on: fem_enable  # GPIO2: Front-End aktivieren (CSD)
      - output.turn_off: fem_tx     # GPIO46: LOW = Empfang (CTX)

external_components:
  - source: github://SzczepanLeon/esphome-components@pull/476/head
    components: [wmbus_radio, wmbus_meter, wmbus_common]
    refresh: 0s

esp32:
  # Die V4 nutzt dieselbe Board-Definition wie die V3 (ESP32-S3)
  board: heltec_wifi_lora_32_V3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  id: component_logger
  level: DEBUG
  baud_rate: 115200

 
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  reboot_timeout: 0s
  
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  version: 3
  
    
mqtt:
  broker: ${mqtt_broker}
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: false   # Home Assistant bekommt die Entitäten schon über die API
  topic_prefix: null    # schaltet die Standard-Topics ab
  log_topic: null       # kein Log über MQTT
  birth_message:        # leer = kein Status beim Start
  will_message:         # leer = kein Status beim Trennen
  reboot_timeout: 0s
  
globals:
  - id: telegram_nr
    type: uint32_t
    initial_value: '0'
  - {id: e_cur,      type: double,      initial_value: '0'}
  - {id: e_new,      type: bool,        initial_value: 'false'}
  - {id: t_str,      type: std::string, initial_value: '""'}
  - {id: t_new,      type: bool,        initial_value: 'false'}
  - {id: e_prev,     type: double,      initial_value: '0'}
  - {id: t_prev,     type: int64_t,     initial_value: '0'}
  - {id: prev_valid, type: bool,        initial_value: 'false'}
  - {id: ref_e,      type: double,      initial_value: '0', restore_value: true}  
  - {id: ref_t,      type: int64_t,     initial_value: '0', restore_value: true}  
  - {id: max_monat,  type: int,         initial_value: '0', restore_value: true}   
  - {id: max_w,      type: float,       initial_value: '0', restore_value: true}
  - {id: mon_prev,   type: int,         initial_value: '0'}
  - {id: max_ts,     type: uint32_t,    initial_value: '0', restore_value: true}
  # Plausibilitätsprüfung der Zählerstände (Bezug und Einspeisung), -1 = unbekannt
  - {id: e_ok,       type: double,      initial_value: '-1'}
  - {id: e_ok_ms,    type: uint32_t,    initial_value: '0'}
  - {id: e_cand,     type: double,      initial_value: '-1'}
  - {id: e_cand_ms,  type: uint32_t,    initial_value: '0'}
  - {id: g_ok,       type: double,      initial_value: '-1'}
  - {id: g_ok_ms,    type: uint32_t,    initial_value: '0'}
  - {id: g_cand,     type: double,      initial_value: '-1'}
  - {id: g_cand_ms,  type: uint32_t,    initial_value: '0'}
  # Zeitpunkt des Eintreffens, damit nur Werte desselben Telegramms gepaart werden
  - {id: e_ms,       type: uint32_t,    initial_value: '0'}
  - {id: t_ms,       type: uint32_t,    initial_value: '0'}    
  
# ---------------------------------------------------------------
# Front-End-Steuerung des Heltec V4 (zusätzlich zum SX1262)
# ---------------------------------------------------------------
output:
  - platform: gpio
    id: vext
    pin: GPIO36
    inverted: true     # LOW = Display-Versorgung an
  - platform: gpio
    id: fem_power
    pin: GPIO7
  - platform: gpio
    id: fem_enable
    pin: GPIO2
  - platform: gpio
    id: fem_tx
    pin:
      number: GPIO46
      ignore_strapping_warning: true

# ---------------------------------------------------------------
# SPI zum SX1262 (Heltec V4)
# ---------------------------------------------------------------
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

wmbus_radio:
  radio_type: SX1262
  cs_pin: GPIO8
  reset_pin: GPIO12
  irq_pin: GPIO14   # DIO1
  busy_pin: GPIO13
  rx_gain: BOOSTED
  rf_switch: true   # DIO2 steuert den HF-Schalter
  has_tcxo: true    # TCXO wird über DIO3 versorgt
  on_frame:
    - then:
        - logger.log:
            format: "RSSI: %ddBm Telegramm: %s (%d Bytes)"
            args: [ frame->rssi(), frame->as_hex().c_str(), frame->data().size() ]

# ---------------------------------------------------------------
# Stromzähler
# ---------------------------------------------------------------
wmbus_meter:
  - id: stromzaehler
    meter_id: ${zaehler_id}      # Zählernummer (hexadezimal mit 0x oder dezimal)
    type: amiplus               # an deinen Zählertyp anpassen
    key: !secret wmbus_key      # AES-Key, 32 Hex-Zeichen
    mode:
      - T1

sensor:
  - platform: wmbus_meter
    parent_id: stromzaehler
    id: aktuelle_leistung
    field: current_power_consumption_kw
    name: "Aktuelle Leistung (Bezug)"
    accuracy_decimals: 0
    device_class: power
    unit_of_measurement: W
    state_class: measurement
    filters:
      - multiply: 1000
  
  - platform: wmbus_meter
    parent_id: stromzaehler
    id: aktuelle_einspeisung
    field: current_power_production_kw
    name: "Aktuelle Leistung (Einspeisung)"
    accuracy_decimals: 0
    device_class: power
    unit_of_measurement: W
    state_class: measurement
    filters:
      - multiply: 1000

  - platform: wmbus_meter
    parent_id: stromzaehler
    id: gesamteinspeisung
    field: total_energy_production_kwh
    name: "Gesamteinspeisung"
    accuracy_decimals: 3
    device_class: energy
    unit_of_measurement: "kWh"
    state_class: total_increasing
    filters:
      # Plausibilitätsfilter: erlaubter Anstieg wächst mit der Zeit (max. 50 kW), siehe README
      - lambda: |-
          const double P_MAX_KW = 50.0;   // höchste plausible Leistung
          const double TOL = 0.05;        // kWh Reserve
          uint32_t jetzt = millis();
          if (id(g_ok) >= 0) {
            double dt_h = (uint32_t)(jetzt - id(g_ok_ms)) / 3600000.0;
            double d = x - id(g_ok);
            if (d >= -0.001 && d <= TOL + P_MAX_KW * dt_h) {
              id(g_ok) = x; id(g_ok_ms) = jetzt; id(g_cand) = -1;
              return x;
            }
          }
          // unplausibel oder noch ohne Basis: erst übernehmen, wenn der nächste Wert dazu passt
          if (id(g_cand) >= 0) {
            double dtc = (uint32_t)(jetzt - id(g_cand_ms)) / 3600000.0;
            if (fabs(x - id(g_cand)) <= TOL + P_MAX_KW * dtc) {
              id(g_ok) = x; id(g_ok_ms) = jetzt; id(g_cand) = -1;
              return x;
            }
          }
          id(g_cand) = x; id(g_cand_ms) = jetzt;
          return {};
              
  - platform: wmbus_meter
    parent_id: stromzaehler
    id: gesamtverbrauch
    field: total_energy_consumption_kwh
    name: "Gesamtverbrauch (Bezug)"
    accuracy_decimals: 3
    device_class: energy
    unit_of_measurement: "kWh"
    state_class: total_increasing
    filters:
      # Plausibilitätsfilter: erlaubter Anstieg wächst mit der Zeit (max. 50 kW), siehe README
      - lambda: |-
          const double P_MAX_KW = 50.0;   // höchste plausible Leistung
          const double TOL = 0.05;        // kWh Reserve
          uint32_t jetzt = millis();
          if (id(e_ok) >= 0) {
            double dt_h = (uint32_t)(jetzt - id(e_ok_ms)) / 3600000.0;
            double d = x - id(e_ok);
            if (d >= -0.001 && d <= TOL + P_MAX_KW * dt_h) {
              id(e_ok) = x; id(e_ok_ms) = jetzt; id(e_cand) = -1;
              return x;
            }
          }
          // unplausibel oder noch ohne Basis: erst übernehmen, wenn der nächste Wert dazu passt
          if (id(e_cand) >= 0) {
            double dtc = (uint32_t)(jetzt - id(e_cand_ms)) / 3600000.0;
            if (fabs(x - id(e_cand)) <= TOL + P_MAX_KW * dtc) {
              id(e_ok) = x; id(e_ok_ms) = jetzt; id(e_cand) = -1;
              return x;
            }
          }
          id(e_cand) = x; id(e_cand_ms) = jetzt;
          return {};
    on_value:
      then:
        - lambda: id(telegram_nr)++;
        - lambda: |-
            id(e_cur) = round(x * 1000.0);
            id(e_new) = true;
            id(e_ms) = millis();
        - script.execute: auswerten          
        - mqtt.publish:
            topic: ${mqtt_topic}
            payload: !lambda |-
              auto wh = [](sensor::Sensor *s) -> long long {
                return s->has_state() ? llround(s->state * 1000.0) : 0;
              };
              auto w = [](sensor::Sensor *s) -> int {
                return s->has_state() ? (int) roundf(s->state) : 0;
              };
              bool hat_max = id(max_monat) != 0;
              char buf[512];
              snprintf(buf, sizeof(buf),
                "{\"1-0:1.8.0\":{\"value\":%lld,\"time\":0},"
                "\"1-0:1.7.0\":{\"value\":%d,\"time\":0},"
                "\"1-0:2.8.0\":{\"value\":%lld,\"time\":0},"
                "\"1-0:2.7.0\":{\"value\":%d,\"time\":0},"
                "\"1-0:1.6.0\":{\"value\":%d,\"time\":%u},"
                "\"1-0:1.4.0\":{\"value\":%d,\"time\":0},"
                "\"1-0:1.5.0\":{\"value\":%d,\"time\":0},"
                "\"api_version\":\"v1\",\"name\":\"\","
                "\"sma_time\":%.3f,\"telegramNr\":%u}",
                wh(id(gesamtverbrauch)),
                w(id(aktuelle_leistung)),
                wh(id(gesamteinspeisung)),
                w(id(aktuelle_einspeisung)),
                hat_max ? (int) roundf(id(max_w)) : 0,
                hat_max ? (unsigned) id(max_ts) : 0u,
                w(id(p_laufend)),
                w(id(p_viertel)),
                millis() / 1000.0,
                (unsigned) id(telegram_nr));
              return std::string(buf);

  - platform: wmbus_meter
    parent_id: stromzaehler
    id: empfangsstaerke
    field: rssi_dbm
    unit_of_measurement: "dBm"
    name: "Stromzähler Empfangsstärke"

  - platform: template
    id: p_viertel
    name: "Leistung letzte Viertelstunde (berechnet)"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    id: p_max
    name: "Maximalleistung Monat (berechnet)"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      if (id(max_monat) == 0) return {};
      return id(max_w);
    
  - platform: template
    id: p_laufend
    name: "Leistung laufende Viertelstunde (berechnet)"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - exponential_moving_average:
          alpha: 0.05
          send_every: 1
      
text_sensor:
  - platform: wmbus_meter
    parent_id: stromzaehler
    field: device_date_time
    name: "Stromzähler Gerätezeit"
    on_value:
      then:
        - lambda: |-
            id(t_str) = x;
            id(t_new) = true;
            id(t_ms) = millis();
        - script.execute: auswerten       

number:
  - platform: template
    id: sync_max_slider
    name: "Vorgabe Monatsmaximum (1.6.0)"
    icon: "mdi:tune"
    unit_of_measurement: "W"
    min_value: 0
    max_value: 25000
    step: 1
    mode: slider
    optimistic: true
    initial_value: 0

button:
  - platform: template
    name: "Sync max"
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          float neuer_wert = id(sync_max_slider).state;
          id(max_w) = neuer_wert;
          
          // Stellt sicher, dass der aktuelle Monat als aktiv gilt und nicht beim nächsten Takt überschrieben wird
          if (id(mon_prev) > 0) {
            id(max_monat) = id(mon_prev);
          }
          // Setzt den Zeitstempel auf die letzte bekannte Zählerzeit (falls vorhanden)
          if (id(t_prev) > 0) {
            id(max_ts) = (uint32_t) id(t_prev);
          }
          
          // Aktualisiert den Sensor in Home Assistant sofort
          id(p_max).publish_state(neuer_wert);
      - logger.log:
          format: "Monatsmaximum (1.6.0) erfolgreich auf %.0f W synchronisiert!"
          args: [ 'id(max_w)' ]

          
i2c:
  sda: GPIO17
  scl: GPIO18
  scan: true

font:
  - file: "gfonts://Roboto"
    id: font_klein
    size: 10

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    reset_pin: GPIO21
    update_interval: 1s
    lambda: |-
      if (id(empfangsstaerke).has_state())
        it.printf(0, 0, id(font_klein), "RSSI:   %.0f dBm", id(empfangsstaerke).state);
      else
        it.print(0, 0, id(font_klein), "--");   
      if (id(gesamtverbrauch).has_state())
        it.printf(0, 12, id(font_klein), "1.8.0:   %.3f kWh", id(gesamtverbrauch).state);
      else
        it.print(0, 12, id(font_klein), "--");        
      if (id(aktuelle_leistung).has_state())
        it.printf(0, 24, id(font_klein), "1.7.0:   %.0f W", id(aktuelle_leistung).state);
      else
        it.print(0, 24, id(font_klein), " --");
      if (id(p_max).has_state())
        it.printf(0, 36, id(font_klein), "1.6.0:   %.0f W", id(p_max).state);
      else
        it.print(0, 36, id(font_klein), " --");
      if (id(p_laufend).has_state())
        it.printf(0, 48, id(font_klein), "1.4.0:   %.0f W", id(p_laufend).state);
      else
        it.print(0, 48, id(font_klein), " --");

script:
  - id: auswerten
    mode: single
    then:
      - lambda: |-
          if (!(id(e_new) && id(t_new))) return;
          // nur Werte aus demselben Telegramm paaren
          int32_t diff = (int32_t)(id(e_ms) - id(t_ms));
          if (diff > 200 || diff < -200) {
            if (diff > 0) id(t_new) = false;   // Zeit ist älter
            else id(e_new) = false;            // Zählerstand ist älter
            return;
          }
          id(e_new) = false;
          id(t_new) = false;

          int y, mo, d, h, mi, s;
          if (sscanf(id(t_str).c_str(), "%d-%d-%d%*c%d:%d:%d", &y, &mo, &d, &h, &mi, &s) != 6) {
            ESP_LOGW("viertelstunde", "Zaehlerzeit nicht lesbar: %s", id(t_str).c_str());
            return;
          }
          // Sekunden seit 1970 aus der Zählerzeit (ohne Zeitzone)
          int yy = y - (mo <= 2);
          int era = (yy >= 0 ? yy : yy - 399) / 400;
          unsigned yoe = (unsigned)(yy - era * 400);
          unsigned doy = (153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5 + d - 1;
          unsigned doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
          int64_t days = (int64_t) era * 146097 + (int64_t) doe - 719468;
          int64_t t = days * 86400 + h * 3600 + mi * 60 + s;
          double e = id(e_cur);

          int64_t tp = id(t_prev);
          if (id(prev_valid) && t > tp && (t / 900) > (tp / 900) && (t - tp) <= ${max_luecke_s}) {
            int64_t tb = (t / 900) * 900;
            double ep = id(e_prev);
            double eb = ep + (e - ep) * (double)(tb - tp) / (double)(t - tp);
            if (tb - id(ref_t) == 900) {
              float p = (float)((eb - id(ref_e)) * 4.0);
              if (p >= 0 && p <= 60000) {
                id(p_viertel).publish_state(p);
                int monat = id(mon_prev);
                if (monat != id(max_monat) || p > id(max_w)) {
                  id(max_monat) = monat;
                  id(max_w) = p;
                  id(max_ts) = (uint32_t) tb;
                  id(p_max).publish_state(p);
                }
              }
            }
            id(ref_t) = tb;
            id(ref_e) = eb;
          }
          // Zwischenstand der laufenden Viertelstunde
          if (id(ref_t) == (t / 900) * 900 && (t - id(ref_t)) >= ${min_laufend_s}) {
            float pl = (float)((e - id(ref_e)) * 3600.0 / (double)(t - id(ref_t)));
            if (pl >= 0) id(p_laufend).publish_state(pl);
          }
          id(e_prev) = e;
          id(t_prev) = t;
          id(mon_prev) = y * 12 + mo;
          id(prev_valid) = true;
